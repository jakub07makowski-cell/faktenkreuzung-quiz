<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rote Welle – Seite nicht gefunden</title>
<link rel="icon" href="/faktenkreuzung-quiz/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Fredoka"; src: url("/faktenkreuzung-quiz/fonts/fredoka-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Fredoka"; src: url("/faktenkreuzung-quiz/fonts/fredoka-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #26335f; font-family: "Fredoka", system-ui, sans-serif; color: #1c1d2e; padding: 16px; box-sizing: border-box; }
  .card { background: #fdf8ec; border: 3px solid #15172b; border-radius: 18px; box-shadow: 0 6px 0 #15172b; padding: 24px; max-width: 420px; text-align: center; }
  .ampel { display: inline-grid; gap: 10px; background: #1a1b24; border: 4px solid #15172b; border-radius: 20px; padding: 12px; }
  .ampel i { width: 52px; height: 52px; border-radius: 50%; background: #34353e; display: block; border: 3px solid #15172b; }
  .ampel i:first-child { background: #ff3b30; box-shadow: 0 0 22px #ff3b30; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  h1 { font-size: 28px; margin: 16px 0 6px; }
  a { display: inline-block; margin-top: 14px; background: #34c759; color: #0d2a14; border: 3px solid #15172b; border-radius: 14px; padding: 10px 20px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #15172b; }
</style>
</head>
<body>
  <div class="card">
    <div class="ampel" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Rote Welle.</h1>
    <p>Diese Seite steht gerade an der Ampel. Sie existiert nicht, oder der Grüne Kreis hat sie umgeleitet.</p>
    <a href="/faktenkreuzung-quiz/">Zurück zur Faktenkreuzung</a>
  </div>
</body>
</html>
